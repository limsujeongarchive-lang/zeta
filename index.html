<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추천 사이트</title>
  <link rel="stylesheet" href="styles.css" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2494566642796564"
    crossorigin="anonymous"></script>
</head>
<body>
  <main class="app-shell">
    <header>
      <h1>로또 번호 추천</h1>
      <p>자동 또는 원하는 개수로 로또 번호를 추천받아 보세요.</p>
    </header>

    <section class="controls">
      <label for="count">추천 세트 개수</label>
      <input type="number" id="count" min="1" max="10" value="1" />

      <button id="generateBtn">번호 추천받기</button>
      <button id="resetBtn" class="secondary">초기화</button>
    </section>

    <section id="results" class="results"></section>

    <section class="partner">
      <h2>제휴 문의</h2>
      <p class="partner-lead">광고·제휴·기타 제안은 아래 양식으로 남겨 주세요.</p>

      <form id="partnerForm" action="https://formspree.io/f/mzepdwaz" method="POST">
        <div class="field">
          <label for="partnerName">이름 / 회사명</label>
          <input type="text" id="partnerName" name="name" required maxlength="60" placeholder="홍길동 / 주식회사 예시" />
        </div>

        <div class="field">
          <label for="partnerEmail">회신받을 이메일</label>
          <input type="email" id="partnerEmail" name="email" required placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="partnerMessage">문의 내용</label>
          <textarea id="partnerMessage" name="message" rows="5" required maxlength="2000" placeholder="제휴 형태와 간단한 소개를 적어 주세요."></textarea>
        </div>

        <input type="hidden" name="_subject" value="[로또 번호 추천] 제휴 문의" />
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="gotcha" />

        <div class="actions">
          <button type="submit" id="partnerSubmitBtn" class="btn primary">문의 보내기</button>
        </div>
      </form>

      <div id="partnerStatus" class="partner-status" role="status" aria-live="polite"></div>
    </section>

    <section class="note">
      <h2>사용 방법</h2>
      <ul>
        <li>"번호 추천받기" 버튼을 눌러 6개 번호를 자동으로 생성합니다.</li>
        <li>한 세트는 1부터 45까지의 중복 없는 번호 6개로 구성됩니다.</li>
        <li>추천 결과는 랜덤으로 생성되며 당첨을 보장하지 않습니다.</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
